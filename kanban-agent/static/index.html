<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mad-bot - MultiTask Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 18px; font-weight: 600; }
    header .subtitle { color: #8b949e; font-size: 13px; }

    .header-actions { margin-left: auto; display: flex; gap: 16px; align-items: center; }

    .new-task { display: flex; gap: 8px; align-items: center; }

    .new-task textarea {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 13px;
      padding: 6px 10px;
      resize: none;
      width: 320px;
      height: 36px;
      line-height: 1.4;
    }
    .new-task textarea:focus { outline: none; border-color: #58a6ff; }

    /* ── Buttons ── */
    button.primary {
      background: #238636; border: 1px solid #2ea043; border-radius: 6px;
      color: #fff; cursor: pointer; font-size: 13px; font-weight: 500;
      padding: 6px 14px; white-space: nowrap;
    }
    button.primary:hover { background: #2ea043; }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }

    button.secondary {
      background: transparent; border: 1px solid #30363d; border-radius: 6px;
      color: #8b949e; cursor: pointer; font-size: 13px; font-weight: 500;
      padding: 6px 14px; white-space: nowrap;
    }
    button.secondary:hover { border-color: #8b949e; color: #e6edf3; }

    button.danger {
      background: transparent; border: 1px solid #f85149; border-radius: 6px;
      color: #f85149; cursor: pointer; font-size: 13px; font-weight: 500;
      padding: 6px 14px; white-space: nowrap;
    }
    button.danger:hover { background: #f8514920; }

    button.card-btn {
      margin-top: 6px; background: transparent; border: 1px solid #30363d;
      border-radius: 6px; color: #8b949e; cursor: pointer; font-size: 11px;
      font-weight: 500; padding: 4px 10px; width: 100%;
    }
    button.card-btn:hover { border-color: #8b949e; color: #e6edf3; }
    button.card-btn.red { border-color: #f85149; color: #f85149; }
    button.card-btn.red:hover { background: #f8514920; }

    /* ── Board view ── */
    #boardView { display: block; }

    .board {
      display: flex; gap: 12px; padding: 20px 24px;
      overflow-x: auto; align-items: flex-start;
    }

    .column {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      min-width: 220px; width: 220px; flex-shrink: 0;
    }

    .column-header {
      padding: 10px 14px; border-bottom: 1px solid #30363d;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #8b949e;
    }
    .column-header .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .column-header .count {
      margin-left: auto; background: #21262d; border-radius: 10px;
      font-size: 11px; padding: 1px 7px; color: #8b949e;
    }

    .cards { padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }

    .card {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 10px 12px; font-size: 13px; cursor: pointer; transition: border-color 0.15s;
    }
    .card:hover { border-color: #58a6ff; }

    .card .task-id { font-size: 11px; color: #8b949e; margin-bottom: 4px; font-family: monospace; }
    .card .desc { color: #e6edf3; line-height: 1.4; margin-bottom: 8px; word-break: break-word; }
    .card .meta { display: flex; flex-direction: column; gap: 4px; }
    .card .branch {
      font-family: monospace; font-size: 11px; color: #8b949e; background: #161b22;
      padding: 2px 6px; border-radius: 4px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .card a.pr-link { font-size: 11px; color: #58a6ff; text-decoration: none; }
    .card a.pr-link:hover { text-decoration: underline; }
    .card .error { font-size: 11px; color: #f85149; word-break: break-word; }

    /* ── Detail view ── */
    #detailView { display: none; flex-direction: column; height: calc(100vh - 57px); }

    .detail-header {
      padding: 16px 24px; border-bottom: 1px solid #30363d;
      display: flex; align-items: flex-start; gap: 16px;
    }
    .detail-header .task-info { flex: 1; min-width: 0; }
    .detail-header .task-info h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .detail-header .task-info .meta-row {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .detail-header .task-info .branch {
      font-family: monospace; font-size: 11px; color: #8b949e;
      background: #21262d; padding: 2px 8px; border-radius: 4px;
    }
    .status-badge {
      font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
      text-transform: uppercase; letter-spacing: 0.4px;
    }

    .conversation {
      flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;
    }

    .msg { display: flex; gap: 12px; max-width: 860px; width: 100%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.assistant { align-self: flex-start; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }
    .msg.user .msg-avatar { background: #1f6feb; }
    .msg.assistant .msg-avatar { background: #6e40c9; }

    .msg-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

    .msg-bubble {
      padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; word-break: break-word;
    }
    .msg.user .msg-bubble { background: #1f6feb22; border: 1px solid #1f6feb44; }
    .msg.assistant .msg-bubble { background: #161b22; border: 1px solid #30363d; }

    .tool-call {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 8px 12px; font-size: 12px; font-family: monospace;
    }
    .tool-call .tool-name { color: #d2a8ff; font-weight: 600; margin-bottom: 4px; }
    .tool-call .tool-arg { color: #8b949e; white-space: pre-wrap; word-break: break-all; }
    .tool-result {
      background: #0d1117; border: 1px solid #30363d; border-left: 3px solid #3fb950;
      border-radius: 6px; padding: 8px 12px; font-size: 12px;
      font-family: monospace; color: #8b949e; white-space: pre-wrap; word-break: break-all;
    }
    .tool-result.error { border-left-color: #f85149; }

    /* ── Follow-up input ── */
    .follow-up {
      border-top: 1px solid #30363d; padding: 16px 24px;
      display: flex; gap: 8px; align-items: flex-end;
    }
    .follow-up textarea {
      flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      color: #e6edf3; font-size: 13px; padding: 8px 12px; resize: none;
      min-height: 36px; max-height: 120px; line-height: 1.5; font-family: inherit;
    }
    .follow-up textarea:focus { outline: none; border-color: #58a6ff; }
    .follow-up textarea:disabled { opacity: 0.5; }

    /* ── Shared ── */
    .spinner {
      display: inline-block; width: 10px; height: 10px;
      border: 2px solid #30363d; border-top-color: #58a6ff;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      margin-right: 4px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #238636;
      border: 1px solid #2ea043; border-radius: 6px; color: #fff;
      font-size: 13px; padding: 10px 16px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }

    .empty-conv { color: #8b949e; font-size: 13px; text-align: center; padding: 40px 0; }
  </style>
</head>
<body>

<header>
  <h1>⚡ Mad-bot - MultiTask Agent</h1>
  <span class="subtitle" id="headerSub">LawnMowerApplication</span>
  <div class="header-actions">
    <div class="new-task" id="boardActions">
      <textarea id="descInput" placeholder="Describe the task for the AI agent…" rows="1"></textarea>
      <button class="primary" id="submitBtn" onclick="submitTask()">Run Agent</button>
      <button class="danger" onclick="resetDatabase()">Reset</button>
    </div>
    <button class="secondary" id="backBtn" style="display:none" onclick="showBoard()">← Back to board</button>
  </div>
</header>

<!-- Board view -->
<div id="boardView">
  <div class="board" id="board"></div>
</div>

<!-- Detail view -->
<div id="detailView">
  <div class="detail-header">
    <div class="task-info">
      <h2 id="detailDesc"></h2>
      <div class="meta-row">
        <span class="status-badge" id="detailBadge"></span>
        <span class="branch" id="detailBranch" style="display:none"></span>
        <a id="detailPrLink" href="#" target="_blank" style="display:none; font-size:12px; color:#58a6ff;">PR →</a>
      </div>
    </div>
  </div>
  <div class="conversation" id="conversation"></div>
  <div class="follow-up" id="followUpBar">
    <textarea id="followInput" placeholder="Ask the agent to make changes, fix something, or iterate…" rows="1"></textarea>
    <button class="primary" id="followBtn" onclick="sendFollowUp()">Send</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const COLUMNS = [
    { key: "queued",    label: "Queued",    color: "#6e7681" },
    { key: "running",   label: "Running",   color: "#58a6ff" },
    { key: "error",     label: "Error",     color: "#f85149" },
    { key: "open",      label: "PR Open",   color: "#3fb950" },
    { key: "commented", label: "Commented", color: "#d29922" },
    { key: "approved",  label: "Approved",  color: "#a371f7" },
    { key: "merged",    label: "Merged",    color: "#8957e5" },
    { key: "closed",    label: "Closed",    color: "#6e7681" },
  ];

  const STATUS_COLORS = {
    queued: "#6e7681", running: "#58a6ff", error: "#f85149",
    open: "#3fb950", commented: "#d29922", approved: "#a371f7",
    merged: "#8957e5", closed: "#6e7681", pr_open: "#3fb950", done: "#3fb950",
  };

  let currentTaskId = null;
  let boardPollTimer = null;
  let detailPollTimer = null;

  // ── Routing ─────────────────────────────────────────────────────────────────

  function taskColumn(task) {
    if (task.status === "closed") return "closed";
    if (task.status === "error") return "error";
    if (task.status === "queued") return "queued";
    if (task.status === "running") return "running";
    if (task.pr_status) return task.pr_status;
    return "open";
  }

  function showBoard() {
    currentTaskId = null;
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('boardView').style.display = 'block';
    document.getElementById('boardActions').style.display = 'flex';
    document.getElementById('backBtn').style.display = 'none';
    document.getElementById('headerSub').textContent = 'LawnMowerApplication';
    clearInterval(detailPollTimer);
    fetchTasks();
    boardPollTimer = setInterval(fetchTasks, 10000);
    window.location.hash = '';
  }

  function showDetail(taskId) {
    currentTaskId = taskId;
    clearInterval(boardPollTimer);
    document.getElementById('boardView').style.display = 'none';
    document.getElementById('detailView').style.display = 'flex';
    document.getElementById('boardActions').style.display = 'none';
    document.getElementById('backBtn').style.display = 'inline-block';
    window.location.hash = taskId;
    loadDetail(taskId);
    detailPollTimer = setInterval(() => loadDetail(taskId), 5000);
  }

  // ── Board ────────────────────────────────────────────────────────────────────

  function cardHtml(task) {
    const isRunning = task.status === "running";
    const spinner = isRunning ? '<span class="spinner"></span>' : '';
    let meta = '';
    if (task.branch) meta += `<div class="branch" title="${task.branch}">${task.branch}</div>`;
    if (task.pr_url && task.pr_number) {
      meta += `<a class="pr-link" href="${task.pr_url}" target="_blank" onclick="event.stopPropagation()">PR #${task.pr_number} →</a>`;
    }
    if (task.error) {
      meta += `<div class="error">${task.error}</div>`;
      meta += `<button class="card-btn red" onclick="event.stopPropagation(); retryTask('${task.id}')">↺ Retry</button>`;
    }
    if (!["running", "queued", "closed"].includes(task.status)) {
      meta += `<button class="card-btn" onclick="event.stopPropagation(); closeTask('${task.id}')">✕ Close</button>`;
    }
    return `
      <div class="card" onclick="showDetail('${task.id}')">
        <div class="task-id">${spinner}#${task.id}</div>
        <div class="desc">${task.description}</div>
        <div class="meta">${meta}</div>
      </div>`;
  }

  function render(tasks) {
    const grouped = {};
    COLUMNS.forEach(c => { grouped[c.key] = []; });
    tasks.forEach(t => { const col = taskColumn(t); if (grouped[col]) grouped[col].push(t); });
    document.getElementById('board').innerHTML = COLUMNS.map(col => {
      const items = grouped[col.key] || [];
      return `
        <div class="column">
          <div class="column-header">
            <span class="dot" style="background:${col.color}"></span>
            ${col.label}
            <span class="count">${items.length}</span>
          </div>
          <div class="cards">${items.map(cardHtml).join('')}</div>
        </div>`;
    }).join('');
  }

  async function fetchTasks() {
    const res = await fetch('/tasks');
    if (res.ok) render(await res.json());
  }

  // ── Detail view ──────────────────────────────────────────────────────────────

  async function loadDetail(taskId) {
    const [taskRes, msgRes] = await Promise.all([
      fetch(`/tasks/${taskId}`),
      fetch(`/tasks/${taskId}/messages`),
    ]);
    if (!taskRes.ok) return;
    const task = await taskRes.json();
    const messages = msgRes.ok ? await msgRes.json() : [];

    // Header
    document.getElementById('detailDesc').textContent = task.description;
    document.getElementById('headerSub').textContent = `#${task.id}`;
    const col = taskColumn(task);
    const badge = document.getElementById('detailBadge');
    badge.textContent = col;
    badge.style.background = (STATUS_COLORS[col] || '#6e7681') + '22';
    badge.style.color = STATUS_COLORS[col] || '#6e7681';
    badge.style.border = `1px solid ${STATUS_COLORS[col] || '#6e7681'}44`;

    const branchEl = document.getElementById('detailBranch');
    if (task.branch) { branchEl.textContent = task.branch; branchEl.style.display = 'inline'; }

    const prLink = document.getElementById('detailPrLink');
    if (task.pr_url) {
      prLink.href = task.pr_url;
      prLink.textContent = `PR #${task.pr_number} →`;
      prLink.style.display = 'inline';
    }

    // Conversation
    renderConversation(messages, task);

    // Follow-up bar
    const canContinue = task.branch && !["running", "queued", "closed"].includes(task.status);
    document.getElementById('followInput').disabled = !canContinue;
    document.getElementById('followBtn').disabled = !canContinue;
    if (task.status === "running") {
      document.getElementById('followBtn').textContent = '…';
    } else {
      document.getElementById('followBtn').textContent = 'Send';
    }
  }

  function renderConversation(messages, task) {
    const el = document.getElementById('conversation');
    if (!messages.length) {
      el.innerHTML = '<div class="empty-conv">No conversation history yet.</div>';
      return;
    }

    const html = messages.map(msg => {
      if (!msg || !msg.content) return '';
      const role = msg.role;
      const blocks = Array.isArray(msg.content) ? msg.content : [];

      return blocks.map(block => {
        if (block.text) {
          const cls = role === 'user' ? 'user' : 'assistant';
          const avatar = role === 'user' ? 'You' : 'AI';
          return `
            <div class="msg ${cls}">
              <div class="msg-avatar">${avatar}</div>
              <div class="msg-body">
                <div class="msg-bubble">${escHtml(block.text)}</div>
              </div>
            </div>`;
        }
        if (block.toolUse) {
          const args = JSON.stringify(block.toolUse.input || {}, null, 2);
          return `
            <div class="msg assistant">
              <div class="msg-avatar">AI</div>
              <div class="msg-body">
                <div class="tool-call">
                  <div class="tool-name">⚙ ${block.toolUse.name}</div>
                  <div class="tool-arg">${escHtml(args)}</div>
                </div>
              </div>
            </div>`;
        }
        if (block.toolResult) {
          const text = (block.toolResult.content || []).map(c => c.text || '').join('\n');
          const isErr = block.toolResult.status === 'error';
          return `
            <div class="msg user">
              <div class="msg-avatar">↩</div>
              <div class="msg-body">
                <div class="tool-result${isErr ? ' error' : ''}">${escHtml(text)}</div>
              </div>
            </div>`;
        }
        return '';
      }).join('');
    }).join('');

    // Only update DOM if content changed to avoid scroll jump
    if (el.dataset.lastHash !== html.length.toString()) {
      el.innerHTML = html || '<div class="empty-conv">No conversation history yet.</div>';
      el.dataset.lastHash = html.length.toString();
      el.scrollTop = el.scrollHeight;
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendFollowUp() {
    const input = document.getElementById('followInput');
    const prompt = input.value.trim();
    if (!prompt || !currentTaskId) return;
    input.value = '';
    document.getElementById('followBtn').disabled = true;
    const res = await fetch(`/tasks/${currentTaskId}/continue`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt }),
    });
    if (!res.ok) {
      showToast('Failed to send follow-up', true);
      document.getElementById('followBtn').disabled = false;
    }
    // Poll will refresh the view
  }

  // ── Board actions ────────────────────────────────────────────────────────────

  async function submitTask() {
    const input = document.getElementById('descInput');
    const btn = document.getElementById('submitBtn');
    const desc = input.value.trim();
    if (!desc) return;
    btn.disabled = true;
    const res = await fetch('/tasks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc }),
    });
    btn.disabled = false;
    if (res.ok) { input.value = ''; showToast('Task queued!'); fetchTasks(); }
    else showToast('Error creating task', true);
  }

  async function resetDatabase() {
    if (!confirm('Reset all tasks? This cannot be undone.')) return;
    const res = await fetch('/tasks', { method: 'DELETE' });
    if (res.ok) { showToast('Database reset'); fetchTasks(); }
    else showToast('Reset failed', true);
  }

  async function closeTask(taskId) {
    const res = await fetch(`/tasks/${taskId}/close`, { method: 'POST' });
    if (!res.ok) showToast('Could not close task', true);
    fetchTasks();
  }

  async function retryTask(taskId) {
    const res = await fetch(`/tasks/${taskId}/retry`, { method: 'POST' });
    if (res.ok) { showToast('Task retrying…'); fetchTasks(); }
    else showToast('Retry failed', true);
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = isError ? '#da3633' : '#238636';
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Init ─────────────────────────────────────────────────────────────────────

  document.getElementById('descInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitTask(); }
  });

  document.getElementById('followInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendFollowUp(); }
  });

  // Handle direct URL with hash
  if (window.location.hash) {
    showDetail(window.location.hash.slice(1));
  } else {
    showBoard();
  }
</script>
</body>
</html>
